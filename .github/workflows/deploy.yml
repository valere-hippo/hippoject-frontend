name: hippoject-frontend-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run production build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hippoject-frontend:latest
            ghcr.io/${{ github.repository_owner }}/hippoject-frontend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64, hippoject-prod]

    steps:
      - name: Log in to GHCR for pull
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Pull and restart frontend
        run: |
          cd "${{ secrets.DEPLOY_PATH }}"
          docker compose --env-file .env.production -f compose.production.yml pull frontend
          docker compose --env-file .env.production -f compose.production.yml up -d --no-deps frontend
