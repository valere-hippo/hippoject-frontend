<section class="page-card table-shell">
  <div class="table-shell__header">
    <div>
      <p class="eyebrow">Cross-project queue</p>
      <h3>Issue navigator</h3>
    </div>
    <div class="toolbar">
      <span>Status</span>
      <span>Priority</span>
      <span>Assignee</span>
    </div>
  </div>

  <div class="table">
    <div class="table__head">
      <span>Key</span>
      <span>Title</span>
      <span>Status</span>
      <span>Priority</span>
      <span>Updated</span>
    </div>

    @for (issue of issues$ | async; track issue.id) {
      <article class="table__row">
        <strong>{{ issue.key }}</strong>
        <span>{{ issue.title }}</span>
        <span class="status">{{ issue.status }}</span>
        <span class="priority {{ issue.priority }}">{{ issue.priority }}</span>
        <span>{{ issue.updatedAt }}</span>
      </article>
    }
  </div>
</section>
